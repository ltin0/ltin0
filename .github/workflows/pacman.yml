# ═══════════════════════════════════════════════════════════════════════════
#  SALVAR EM:  .github/workflows/pacman.yml   (no repo ltin0/ltin0)
#
#  O que faz: transforma o grid de contribuições num Pac-Man animado e publica
#  os SVGs na branch "output" deste mesmo repositório.
#
#  Action:  https://github.com/abozanona/pacman-contribution-graph
#  Demo:    https://abozanona.github.io/pacman-contribution-graph/
#
#  Saída (é o que o README consome):
#    https://raw.githubusercontent.com/ltin0/ltin0/output/pacman-contribution-graph.svg
#    https://raw.githubusercontent.com/ltin0/ltin0/output/pacman-contribution-graph-dark.svg
#
#  ⚠️ FORCE PUSH NA BRANCH "output"
#     O passo de publicação sobrescreve a branch inteira. Nenhum outro workflow
#     pode publicar em "output" — foi por isso que o commit-invaders.yml saiu.
#     Se um dia quiser rodar dois geradores, use branches de saída diferentes.
#
#  🔧 TROCAR DE JOGO: mude o input "games" abaixo. Valores aceitos, além de
#     pacman: breakout, galaga, puzzle-bobble, bomberman, minesweeper.
#     O arquivo gerado acompanha o nome: <jogo>-contribution-graph.svg —
#     então lembre de ajustar as URLs na seção correspondente do README.
# ═══════════════════════════════════════════════════════════════════════════

name: Generate Pac-Man contribution graph

on:
  schedule:
    # Todo dia às 03:00 UTC (00:00 em Brasília). Cron do GitHub roda em UTC.
    # 🔧 EDITAR: ajuste o horário se quiser
    - cron: "0 3 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Necessário para o passo de publicação escrever na branch "output"
    permissions:
      contents: write

    steps:
      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # 🔧 EDITAR: lista separada por vírgula. Um arquivo por jogo.
          games: "pacman"
          # Mantém a régua de meses acima do grid (fica mais legível no README)
          hide_month_labels: "false"

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
