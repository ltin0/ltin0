# ═══════════════════════════════════════════════════════════════════════════
#  SALVAR EM:  .github/workflows/commit-invaders.yml   (no repo ltin0/ltin0)
#
#  O que faz: transforma o seu grid de contribuições num Space Invaders animado.
#  As células do grid são arrancadas do grid, viram invasores em formação, e uma
#  nave dispara laser destruindo onda por onda. Animação 100% CSS — sem
#  JavaScript, portanto segura para o README do GitHub.
#
#  Action:  https://github.com/Goblinlordx/commit-invaders   (v1 — verificado,
#           última release v1.2.1 no Marketplace)
#  Demo:    https://goblinlordx.github.io/commit-invaders
#
#  A própria action commita os SVGs na branch "output" — não precisa de um
#  passo extra de publicação (diferente do snake).
#  Saída:   https://raw.githubusercontent.com/ltin0/ltin0/output/commit-invaders.svg
#           https://raw.githubusercontent.com/ltin0/ltin0/output/commit-invaders-dark.svg
#
#  ⚠️ RISCO A CONSIDERAR: é um projeto novo e pequeno (poucas estrelas, 2
#     contribuidores). Funciona, mas tem mais chance de ficar sem manutenção do
#     que o Platane/snk. Se um dia a imagem quebrar no seu README, o plano B é
#     voltar para o snake. Por isso deixei a versão pinada em @v1.
# ═══════════════════════════════════════════════════════════════════════════

name: Generate Commit Invaders

on:
  schedule:
    # Todo dia às 03:00 UTC (00:00 em Brasília). Cron do GitHub roda em UTC.
    # 🔧 EDITAR: ajuste o horário se quiser
    - cron: "0 3 * * *"
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Necessário para a action escrever na branch "output"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Space Invaders SVGs
        uses: Goblinlordx/commit-invaders@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user_name: ${{ github.repository_owner }}
          # 🔧 OPCIONAL — defaults da action, descomente só se quiser mudar:
          # output_branch: output               # branch de destino
          # output_file: commit-invaders.svg    # nome do arquivo gerado
          # no_scoreboard: "true"               # remove o placar e acelera a animação
